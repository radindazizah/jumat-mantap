<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validasi Undangan Zoom Meeting</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 540px;
            text-align: center;
        }
        h2 { color: #2d3748; margin-bottom: 10px; }
        p.subtitle { color: #718096; font-size: 14px; margin-bottom: 20px; }
        label.field { display: block; text-align: left; font-size: 13px; color: #4a5568; margin-bottom: 5px; font-weight: 600; }
        select, input[type="email"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            background: #fff;
        }
        button {
            width: 100%;
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover:not(:disabled) { background-color: #2b6cb0; }
        button:disabled { background-color: #a0aec0; cursor: not-allowed; }
        .status {
            font-size: 12.5px;
            margin: -5px 0 15px;
            text-align: left;
            color: #718096;
        }
        .status.ok { color: #2f855a; }
        .status.err { color: #c53030; }
        .status a { color: #3182ce; cursor: pointer; text-decoration: underline; }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            display: none;
        }
        .success { background-color: #f0fff4; border: 1px solid #c6f6d5; color: #22543d; }
        .error { background-color: #fff5f5; border: 1px solid #fed7d7; color: #742a2a; text-align: center; }
        .highlight { background: #feebc8; padding: 2px 6px; border-radius: 4px; font-weight: bold; color: #c05621; font-family: monospace; }
        .room-box {
            background-color: #edf2f7;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            border-left: 4px solid #4a5568;
        }
        .room-title { font-weight: bold; color: #2d3748; margin-bottom: 5px; font-size: 14px; }
        .room-list { margin: 0; padding-left: 20px; font-size: 13.5px; color: #4a5568; }
        .room-list li.mine { color: #22543d; background: #c6f6d5; border-radius: 4px; padding: 2px 6px; margin-left: -6px; }
        .reg-box {
            background: #fff;
            border: 1px solid #c6f6d5;
            border-radius: 6px;
            padding: 10px 12px;
            margin: 10px 0;
            font-size: 13.5px;
            line-height: 1.6;
        }
        .btn-zoom {
            display: inline-block;
            width: 100%;
            text-align: center;
            background-color: #2f855a;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            margin-top: 18px;
            font-weight: bold;
            box-sizing: border-box;
        }
        .btn-zoom:hover { background-color: #22543d; }
        ol { padding-left: 20px; margin: 10px 0; font-size: 14px; line-height: 1.6; }
        li { margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Akses Undangan Zoom Jumat Mantap</h2>
    <p class="subtitle">Pilih tanggal sesi, lalu masukkan email yang telah Anda daftarkan di Google Form untuk melihat akses masuk Zoom</p>

    <label class="field" for="jadwalSelect">Jadwal (Hari Jumat)</label>
    <select id="jadwalSelect"></select>

    <div id="status" class="status">Memuat daftar peserta...</div>

    <label class="field" for="emailInput">Email terdaftar</label>
    <input type="email" id="emailInput" placeholder="contoh@email.com" required>
    <button id="btnCek" onclick="cekUndangan()" disabled>Verifikasi Email</button>

    <div id="result" class="result-box"></div>
</div>

<script>
    // ================== KONFIGURASI ==================
    const CONFIG = {
        // ID Google Sheet (bagian antara /d/ dan /edit pada URL)
        sheetId: "13p_dI1oo6pbMdpujY3Wi2cyUroq5JO_7PV9gkXvfSgg",
        // Nama tab yang berisi respons Google Form
        sheetName: "Form Responses 1",
        // Kolom pada sheet: B=Email, D=Nama Perusahaan, G=Tema, H=Jadwal, I=Sesi
        kolom: { email: "B", perusahaan: "D", tema: "G", jadwal: "H", sesi: "I" },
        // Jumlah hari Jumat ke depan yang ditampilkan di pilihan jadwal
        jumlahJumat: 10
    };

    // Akun Sewa Zoom
    const infoZoom = {
        link: "https://us06web.zoom.us/j/89911617809?pwd=HC0nWdUym4MegXSGT51yf8yBfgjbHR.1",
        meetingId: "899 1161 7809",
        passcode: "jumantap"
    };

    // Breakout room dan kata kunci tema konsultasi yang diarahkan ke room tsb
    const daftarRoom = [
        { no: 1, nama: "Registrasi Impor dan Produsen", kunci: ["registrasi"] },
        { no: 2, nama: "Notifikasi dan Pengangkutan B3", kunci: ["notifikasi", "pengangkutan"] },
        { no: 3, nama: "Proper B3 dan PILAR",            kunci: ["proper", "pelaporan", "pilar"] }
    ];

    const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

    // ================== STATE ==================
    let semuaBaris = null;    // seluruh baris dari sheet (dimuat sekali)
    let pesertaMap = {};      // email (lowercase) -> { kode, nama, daftar: [{tema, sesi}] }
    let jadwalAktif = "";     // contoh: "Jumat, 23 Oktober 2026"
    let tglAktif = null;      // objek Date dari Jumat yang dipilih
    let sedangMemuat = false;

    // ================== UTILITAS ==================
    function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
            { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
        ));
    }

    function formatJadwal(d) {
        return "Jumat, " + d.getDate() + " " + BULAN[d.getMonth()] + " " + d.getFullYear();
    }

    function isoTgl(d) {
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    // Daftar hari Jumat: hari ini (jika Jumat) atau Jumat berikutnya, lalu beberapa Jumat setelahnya
    function hitungJumat() {
        const hasil = [];
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        d.setDate(d.getDate() + ((5 - d.getDay() + 7) % 7));
        for (let i = 0; i < CONFIG.jumlahJumat; i++) {
            hasil.push(new Date(d.getTime()));
            d.setDate(d.getDate() + 7);
        }
        return hasil;
    }

    function samaTanggal(a, b) {
        return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }

    function buatTanggal(y, m, d) {
        const t = new Date(y, m, d);
        return (t.getFullYear() === y && t.getMonth() === m && t.getDate() === d) ? t : null;
    }

    // Membaca isi kolom "Pilih Jadwal" dalam berbagai bentuk, lalu mengembalikan daftar kemungkinan tanggal:
    //  - teks Indonesia  : "Jumat, 23 Oktober 2026"
    //  - angka bertanda / : "10/23/2026" (bulan/hari/tahun) atau "23/10/2026" (hari/bulan/tahun)
    //  - format ISO      : "2026-10-23"
    //  - sel bertipe tanggal di Google Sheets (dikirim sebagai "Date(2026,9,23)")
    function kandidatTanggal(cell) {
        const hasil = [];
        if (!cell) return hasil;
        const v = cell.v, f = cell.f;
        if (typeof v === "string") {
            const md = v.match(/^Date\((\d+),\s*(\d+),\s*(\d+)/);
            if (md) { hasil.push(new Date(+md[1], +md[2], +md[3])); return hasil; }
        }
        const teks = [f, v].filter(x => typeof x === "string" && x).join(" ");
        let m = teks.match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
        if (m) {
            const idx = BULAN.findIndex(b => b.toLowerCase() === m[2].toLowerCase());
            const t = idx >= 0 ? buatTanggal(+m[3], idx, +m[1]) : null;
            if (t) hasil.push(t);
        }
        m = teks.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (m) { const t = buatTanggal(+m[1], +m[2] - 1, +m[3]); if (t) hasil.push(t); }
        m = teks.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/);
        if (m) {
            const a = +m[1], b = +m[2], y = +m[3];
            const mdy = buatTanggal(y, a - 1, b);   // bulan/hari/tahun
            const dmy = buatTanggal(y, b - 1, a);   // hari/bulan/tahun
            if (mdy) hasil.push(mdy);
            if (dmy) hasil.push(dmy);
        }
        return hasil;
    }

    // Ambil data dari Google Sheets via Google Visualization API (JSONP, tanpa masalah CORS)
    function ambilSheet(query) {
        return new Promise((resolve, reject) => {
            const cb = "gviz_cb_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
            const s = document.createElement("script");
            const timer = setTimeout(() => { bersih(); reject(new Error("timeout")); }, 20000);
            function bersih() { clearTimeout(timer); delete window[cb]; s.remove(); }
            window[cb] = data => { bersih(); resolve(data); };
            s.onerror = () => { bersih(); reject(new Error("gagal memuat")); };
            s.src = "https://docs.google.com/spreadsheets/d/" + CONFIG.sheetId + "/gviz/tq"
                + "?sheet=" + encodeURIComponent(CONFIG.sheetName)
                + "&tq=" + encodeURIComponent(query)
                + "&tqx=" + encodeURIComponent("out:json;responseHandler:" + cb);
            document.head.appendChild(s);
        });
    }

    function setStatus(teks, kelas, adaRetry) {
        const el = document.getElementById("status");
        el.className = "status " + (kelas || "");
        el.innerHTML = esc(teks) + (adaRetry ? ' <a onclick="muatData()">Coba lagi</a>' : "");
    }

    function cariRoom(tema) {
        const t = String(tema || "").toLowerCase();
        return daftarRoom.find(r => r.kunci.some(k => t.includes(k))) || null;
    }

    // ================== MUAT DATA PESERTA ==================
    async function muatData() {
        if (sedangMemuat) return;
        sedangMemuat = true;
        const btn = document.getElementById("btnCek");
        btn.disabled = true;
        document.getElementById("result").style.display = "none";
        setStatus("Memuat daftar peserta...");

        const k = CONFIG.kolom;
        // Hanya kolom yang dibutuhkan yang diambil (nomor WhatsApp dan nama pemohon tidak ikut terunduh)
        const query = "select " + [k.email, k.perusahaan, k.tema, k.jadwal, k.sesi].join(", ");

        try {
            const data = await ambilSheet(query);
            if (data.status === "error") {
                throw new Error((data.errors && data.errors[0] && data.errors[0].detailed_message) || "query error");
            }
            semuaBaris = (data.table && data.table.rows) || [];
            terapkanJadwal();
        } catch (e) {
            console.error(e);
            semuaBaris = null;
            pesertaMap = {};
            setStatus("Gagal memuat daftar peserta. Pastikan Google Sheet dapat dilihat oleh siapa saja yang memiliki link.", "err", true);
        } finally {
            sedangMemuat = false;
        }
    }

    // Saring baris sesuai Jumat yang dipilih, lalu bentuk daftar peserta + kode INV
    function terapkanJadwal() {
        if (!semuaBaris) return;
        const peta = {};
        let urut = 0;

        semuaBaris.forEach(r => {
            const c = r.c || [];
            if (!kandidatTanggal(c[3]).some(t => samaTanggal(t, tglAktif))) return;
            const val = i => (c[i] && c[i].v != null) ? String(c[i].v).trim() : "";
            const email = val(0).toLowerCase();
            if (!email) return;
            const item = { tema: val(2), sesi: val(4) };
            if (!peta[email]) {
                urut++;
                peta[email] = { kode: "[INV-" + urut + "]", nama: val(1), daftar: [item] };
            } else {
                const ada = peta[email].daftar.some(x => x.tema === item.tema && x.sesi === item.sesi);
                if (!ada) peta[email].daftar.push(item);
            }
        });

        pesertaMap = peta;
        document.getElementById("result").style.display = "none";
        setStatus(urut + " email terdaftar untuk " + jadwalAktif + ".", "ok");
        document.getElementById("btnCek").disabled = false;
    }

    // ================== VERIFIKASI ==================
    function cekUndangan() {
        const inputEmail = document.getElementById("emailInput").value.trim().toLowerCase();
        const resultDiv = document.getElementById("result");

        if (!inputEmail) {
            alert("Silakan masukkan email terlebih dahulu.");
            return;
        }

        const peserta = pesertaMap[inputEmail];

        if (peserta) {
            const kamar = new Set();
            const baris = peserta.daftar.map(d => {
                const room = cariRoom(d.tema);
                if (room) kamar.add(room.no);
                return "<div>ðŸ—“ï¸ " + esc(d.sesi || "-") + " &mdash; " + esc(d.tema || "-")
                    + (room ? " <em>(Room " + room.no + ")</em>" : "") + "</div>";
            }).join("");

            const roomHtml = daftarRoom.map(r =>
                '<li class="' + (kamar.has(r.no) ? "mine" : "") + '"><strong>Room ' + r.no + ":</strong> "
                + esc(r.nama) + (kamar.has(r.no) ? " â¬… Room Anda" : "") + "</li>"
            ).join("");

            resultDiv.className = "result-box success";
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `
                <h3 style="margin-top:0;">âœ”ï¸ Email Terverifikasi!</h3>
                <p>Halo <strong>${esc(peserta.nama)}</strong>, Anda terdaftar pada <strong>${esc(jadwalAktif)}</strong>:</p>
                <div class="reg-box">${baris}</div>
                <p>Berikut adalah tata cara masuk ruangan:</p>
                <ol>
                    <li>Buka aplikasi Zoom Anda.</li>
                    <li>Sebelum join, <strong>WAJIB</strong> ganti nama tampilan (Display Name) Zoom Anda menjadi: <span class="highlight">${esc(peserta.kode)} ${esc(peserta.nama)}</span></li>
                    <li>Meeting ID: <strong>${esc(infoZoom.meetingId)}</strong></li>
                    <li>Gunakan Passcode berikut jika diminta: <strong>${esc(infoZoom.passcode)}</strong></li>
                    <li>Host di Waiting Room hanya akan meng-<strong>ACC</strong> peserta yang menggunakan format kode <span class="highlight">${esc(peserta.kode)}</span>.</li>
                    <li>Setelah berhasil masuk ke Main Room Zoom, silakan masuk ke <strong>Breakout Room</strong> sesuai tema konsultasi Anda:
                        <div class="room-box">
                            <div class="room-title">ðŸ“Œ Daftar Room yang Tersedia:</div>
                            <ul class="room-list">${roomHtml}</ul>
                        </div>
                    </li>
                </ol>
                <a href="${infoZoom.link}" target="_blank" rel="noopener noreferrer" class="btn-zoom">
                    KLIK UNTUK MASUK ZOOM
                </a>
            `;
        } else {
            resultDiv.className = "result-box error";
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `
                <h3 style="margin-top:0;">âŒ Akses Ditolak</h3>
                <p>Email <strong>${esc(inputEmail)}</strong> tidak terdaftar pada <strong>${esc(jadwalAktif)}</strong>. Pastikan Anda memilih tanggal yang sesuai dengan pendaftaran Anda, atau hubungi panitia jika ada kekeliruan.</p>
            `;
        }
    }

    // ================== INISIALISASI ==================
    (function init() {
        const sel = document.getElementById("jadwalSelect");
        const daftarJumat = hitungJumat();
        daftarJumat.forEach(d => {
            const o = document.createElement("option");
            o.value = isoTgl(d);
            o.textContent = formatJadwal(d);
            sel.appendChild(o);
        });
        function pilih() {
            tglAktif = daftarJumat[sel.selectedIndex];
            jadwalAktif = formatJadwal(tglAktif);
        }
        pilih();
        sel.addEventListener("change", () => {
            pilih();
            if (semuaBaris) terapkanJadwal(); else muatData();
        });
        document.getElementById("emailInput").addEventListener("keydown", e => {
            if (e.key === "Enter" && !document.getElementById("btnCek").disabled) cekUndangan();
        });
        muatData();
    })();
</script>

</body>
</html>
